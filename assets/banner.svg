<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f1b33"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#34d399;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#34d399;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#818cf8;#34d399" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 0.65; }
    }
    @keyframes floatPath {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    .node-pulse {
      animation: pulseOrb 4s ease-in-out infinite;
      transform-origin: center;
    }
    .stream-line {
      stroke-dasharray: 12 8;
      animation: floatPath 20s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 1.5px;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Animated Ambient Orbs -->
  <circle cx="180" cy="90" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1020" cy="270" r="160" fill="#818cf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="600" cy="180" r="180" fill="#34d399" opacity="0.08" filter="url(#glow)"/>

  <!-- Regulatory Network Stream Lines -->
  <g opacity="0.6">
    <path d="M 50 180 Q 300 60, 600 180 T 1150 180" fill="none" stroke="url(#primaryGlow)" stroke-width="2.5" class="stream-line"/>
    <path d="M 50 220 Q 350 320, 600 200 T 1150 140" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" class="stream-line" style="animation-duration: 15s;"/>
    <path d="M 80 120 Q 450 40, 750 240 T 1120 220" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.3" class="stream-line" style="animation-duration: 25s;"/>
  </g>

  <!-- Constellation Nodes (Representing Submission Lifecycles) -->
  <g>
    <!-- FDA Node -->
    <circle cx="160" cy="180" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#subtleGlow)"/>
    <circle cx="160" cy="180" r="6" fill="#38bdf8">
      <animate attributeName="r" values="5;7;5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="160" y="218" text-anchor="middle" fill="#94a3b8" font-size="12" class="tag-text">FDA / eCTD</text>

    <!-- EMA Node -->
    <circle cx="1040" cy="180" r="22" fill="#0f172a" stroke="#818cf8" stroke-width="2" filter="url(#subtleGlow)"/>
    <circle cx="1040" cy="180" r="6" fill="#818cf8">
      <animate attributeName="r" values="5;7;5" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="1040" y="218" text-anchor="middle" fill="#94a3b8" font-size="12" class="tag-text">EMA / SPOR</text>

    <!-- PMDA Node -->
    <circle cx="600" cy="80" r="18" fill="#0f172a" stroke="#34d399" stroke-width="2" filter="url(#subtleGlow)"/>
    <circle cx="600" cy="80" r="5" fill="#34d399">
      <animate attributeName="r" values="4;6;4" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="600" y="55" text-anchor="middle" fill="#94a3b8" font-size="11" class="tag-text">GLOBAL HA</text>

    <!-- Compliance Shield Icon -->
    <g transform="translate(600, 180)">
      <circle cx="0" cy="0" r="44" fill="#0f172a" stroke="url(#primaryGlow)" stroke-width="3" filter="url(#glow)">
        <animate attributeName="stroke-width" values="2;4;2" dur="4s" repeatCount="indefinite"/>
      </circle>
      <!-- Stylized Shield & Dossier -->
      <path d="M 0 -22 L 18 -12 V 4 C 18 16, 0 24, 0 24 C 0 24, -18 16, -18 4 V -12 Z" fill="none" stroke="url(#primaryGlow)" stroke-width="2.5"/>
      <path d="M -7 1 L -2 6 L 8 -4" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Header Badge -->
  <g transform="translate(600, 115)">
    <rect x="-185" y="-15" width="370" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="-165" cy="0" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" text-anchor="middle" fill="#38bdf8" font-size="12" class="tag-text">LIFE SCIENCES REGULATORY PLATFORMS &amp; TOOLS</text>
    <circle cx="165" cy="0" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main Title -->
  <text x="600" y="260" text-anchor="middle" fill="#ffffff" font-size="34" class="title-text" filter="url(#subtleGlow)">
    REGULATORY INFORMATION MANAGEMENT
  </text>

  <!-- Gradient Underline Accent -->
  <rect x="360" y="274" width="480" height="3.5" rx="2" fill="url(#primaryGlow)"/>

  <!-- Subtitle Tags -->
  <g transform="translate(600, 312)">
    <!-- Pill 1 -->
    <g transform="translate(-310, 0)">
      <rect x="-85" y="-13" width="170" height="26" rx="13" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="0" y="4.5" text-anchor="middle" fill="#cbd5e1" font-size="11.5" class="subtitle-text">📂 eCTD &amp; Submissions</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(-100, 0)">
      <rect x="-85" y="-13" width="170" height="26" rx="13" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="0" y="4.5" text-anchor="middle" fill="#cbd5e1" font-size="11.5" class="subtitle-text">📑 Dossier Tracking</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(100, 0)">
      <rect x="-85" y="-13" width="170" height="26" rx="13" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="0" y="4.5" text-anchor="middle" fill="#cbd5e1" font-size="11.5" class="subtitle-text">🏛️ Health Authorities</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(310, 0)">
      <rect x="-85" y="-13" width="170" height="26" rx="13" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="0" y="4.5" text-anchor="middle" fill="#cbd5e1" font-size="11.5" class="subtitle-text">🛡️ 21 CFR Part 11</text>
    </g>
  </g>
</svg>